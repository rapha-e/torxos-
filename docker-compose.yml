version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Banco de Dados Relacional Principal (PostgreSQL 16 Multi-Tenant)
  # ---------------------------------------------------------------------------
  evorix_postgres:
    image: postgres:16-alpine
    container_name: evorix_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evorix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evorix_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-evorix_db}
    ports:
      - "5432:5432"
    volumes:
      - evorix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evorix_user} -d ${POSTGRES_DB:-evorix_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Fila de Mensagens & Cache de Sessão (Redis 7 + BullMQ)
  # ---------------------------------------------------------------------------
  evorix_redis:
    image: redis:7-alpine
    container_name: evorix_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - evorix_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Armazenamento de Objetos S3-Compatible (Fotos de Check-in, Laudos e Mídias)
  # ---------------------------------------------------------------------------
  evorix_minio:
    image: minio/minio:latest
    container_name: evorix_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_secret_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - evorix_miniodata:/data

  # ---------------------------------------------------------------------------
  # Gateway WhatsApp (Evolution API v1.8.2)
  # ---------------------------------------------------------------------------
  evorix_whatsapp:
    image: atendai/evolution-api:v1.8.2
    container_name: evorix_whatsapp
    restart: always
    environment:
      - SERVER_PORT=8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-evorix_global_wpp_secret}
    ports:
      - "8080:8080"

  # ---------------------------------------------------------------------------
  # Backend NestJS 10 (Fastify + Prisma Engine PostgreSQL + Gemini 2.5 Flash)
  # ---------------------------------------------------------------------------
  evorix_api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: evorix_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "postgresql://${POSTGRES_USER:-evorix_user}:${POSTGRES_PASSWORD:-evorix_secure_password}@evorix_postgres:5432/${POSTGRES_DB:-evorix_db}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-evorix_super_secret_jwt_key_2026_production_ready}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-evorix_super_refresh_jwt_key_2026_production_ready}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      REDIS_HOST: evorix_redis
      REDIS_PORT: 6379
      EVOLUTION_API_URL: http://evorix_whatsapp:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-evorix_global_wpp_secret}
      MINIO_ENDPOINT: evorix_minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio_secret_password}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-evorix-media}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-sua_chave_gemini_aqui}
    ports:
      - "3001:3001"
    depends_on:
      evorix_postgres:
        condition: service_healthy
      evorix_redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend Next.js 14 Standalone (Luxury Off-White Design System)
  # ---------------------------------------------------------------------------
  evorix_web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    container_name: evorix_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - "3000:3000"
    depends_on:
      - evorix_api

  # ---------------------------------------------------------------------------
  # Reverse Proxy & Edge Gateway Nginx (Unifica porta 80/443 e roteia /api)
  # ---------------------------------------------------------------------------
  evorix_nginx:
    image: nginx:alpine
    container_name: evorix_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - evorix_web
      - evorix_api

volumes:
  evorix_pgdata:
  evorix_redisdata:
  evorix_miniodata:
