# ==============================================================================
# TorxOS / Evorix — Docker Compose de PRODUÇÃO Otimizado (VPS / Cloud Dedicada)
# ==============================================================================
# Otimizações de Produção:
# 1. MinIO Integrado com limites de recursos
# 2. Build nativo e suporte a GHCR
# 3. Limites Estritos de Memória: Protege a VPS contra estouro de RAM (OOM Killer)
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Banco de Dados Relacional Principal (PostgreSQL 16 Multi-Tenant)
  # ---------------------------------------------------------------------------
  evorix_postgres:
    image: postgres:16-alpine
    container_name: evorix_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evorix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evorix_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-evorix_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - evorix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evorix_user} -d ${POSTGRES_DB:-evorix_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M

  # ---------------------------------------------------------------------------
  # 2. Fila de Mensagens & Cache de Sessão (Redis 7 + BullMQ)
  # ---------------------------------------------------------------------------
  evorix_redis:
    image: redis:7-alpine
    container_name: evorix_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - evorix_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # 3. Armazenamento de Objetos S3-Compatible Local (MinIO)
  # ---------------------------------------------------------------------------
  evorix_minio:
    image: minio/minio:latest
    container_name: evorix_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin_s3_torxos}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-torxos_super_minio_s3_secret_2026}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - evorix_miniodata:/data
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # 4. Gateway WhatsApp (Evolution API v2)
  # ---------------------------------------------------------------------------
  evorix_whatsapp:
    image: evoapicloud/evolution-api:latest
    container_name: evorix_whatsapp
    restart: always
    environment:
      - SERVER_PORT=8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-evorix_global_wpp_secret}
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          memory: 1024M

  # ---------------------------------------------------------------------------
  # 4. Backend NestJS 10 (Fastify + Prisma Engine + Cloudflare R2 + Gemini)
  # ---------------------------------------------------------------------------
  evorix_api:
    image: ${DOCKER_IMAGE_API:-torxos-api:latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: evorix_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "postgresql://${POSTGRES_USER:-evorix_user}:${POSTGRES_PASSWORD:-evorix_secure_password}@evorix_postgres:5432/${POSTGRES_DB:-evorix_db}?schema=public"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      REDIS_HOST: evorix_redis
      REDIS_PORT: 6379
      EVOLUTION_API_URL: http://evorix_whatsapp:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Armazenamento S3 (MinIO Local nativo ou Cloudflare R2 / AWS S3)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-evorix_minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin_s3_torxos}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-torxos_super_minio_s3_secret_2026}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-torxos-media}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://evorix_minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-admin_s3_torxos}
      S3_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-torxos_super_minio_s3_secret_2026}
      S3_BUCKET_NAME: ${MINIO_BUCKET_NAME:-torxos-media}
      S3_PUBLIC_DOMAIN: ${S3_PUBLIC_DOMAIN:-}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      evorix_postgres:
        condition: service_healthy
      evorix_redis:
        condition: service_healthy
      evorix_minio:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1024M

  # ---------------------------------------------------------------------------
  # 5. Frontend Next.js 14 Standalone (Luxury Off-White Design System)
  # ---------------------------------------------------------------------------
  evorix_web:
    image: ${DOCKER_IMAGE_WEB:-torxos-web:latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: evorix_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - evorix_api
    deploy:
      resources:
        limits:
          memory: 1024M

  # ---------------------------------------------------------------------------
  # 6. Reverse Proxy & Edge Gateway Nginx (Unifica porta 80/443 e roteia /api)
  # ---------------------------------------------------------------------------
  evorix_nginx:
    image: nginx:alpine
    container_name: evorix_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Descomente para mapear certificados SSL Let's Encrypt da VPS:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - evorix_web
      - evorix_api
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  evorix_pgdata:
  evorix_redisdata:
  evorix_miniodata:
