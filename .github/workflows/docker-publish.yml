name: Build & Publish Docker Images (GHCR)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'package*.json'
      - 'docker/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-api:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase image name
        id: image_name
        run: |
          echo "IMAGE_NAME=${REGISTRY}/${{ github.repository_owner }}/torxos-api" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image_name.outputs.IMAGE_NAME }}:latest
            ${{ steps.image_name.outputs.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-web:
    name: Build & Push Web Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase image name
        id: image_name
        run: |
          echo "IMAGE_NAME=${REGISTRY}/${{ github.repository_owner }}/torxos-web" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Build and push Web Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          tags: |
            ${{ steps.image_name.outputs.IMAGE_NAME }}:latest
            ${{ steps.image_name.outputs.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
