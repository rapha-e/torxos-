events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Otimizações de desempenho e limites de anexo
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    # Upstreams para os serviços internos
    upstream evorix_web_upstream {
        server evorix_web:3000;
    }

    upstream evorix_api_upstream {
        server evorix_api:3001;
    }

    # Redirecionamento HTTP -> HTTPS (com suporte a renovação acme Let's Encrypt)
    server {
        listen 80;
        server_name torxos.tech www.torxos.tech localhost _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Servidor HTTPS Seguro Oficial
    server {
        listen 443 ssl;
        server_name torxos.tech www.torxos.tech localhost _;

        ssl_certificate /etc/letsencrypt/live/torxos.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/torxos.tech/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Compressão Gzip para performance Luxury
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Roteamento de APIs do Backend NestJS
        location /api/v1/ {
            proxy_pass http://evorix_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Documentação Swagger da API
        location /api/docs {
            proxy_pass http://evorix_api_upstream/api/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Roteamento do Frontend Next.js Standalone
        location / {
            proxy_pass http://evorix_web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
